# Sunshine OS installer sequence
---
modules-search: [ local ]
instances:
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf
- id: hyprland
  module: shellprocess
  config: shellprocess-hyprland.conf
- id: usershell
  module: shellprocess
  config: shellprocess-usershell.conf
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@cleanup
  - shellprocess@hyprland
  - users
  - shellprocess@usershell
  - networkcfg
  - hwclock
  - services-systemd
  - initcpio
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
branding: sunshine
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
