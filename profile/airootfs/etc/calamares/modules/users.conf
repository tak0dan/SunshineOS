---
defaultGroups: [ wheel, audio, video, storage, optical, lp, network, power, input, i2c ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: false
availableShells: /usr/bin/fish, /bin/bash, /usr/bin/zsh
userShell: /usr/bin/fish
passwordRequirements:
  minLength: 1
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
