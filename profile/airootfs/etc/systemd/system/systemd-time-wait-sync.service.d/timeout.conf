# Do not hold the boot back for ever when no time server is reachable (offline machine, blocked NTP).
# pacman-init waits for time-sync.target and multi-user.target waits for pacman-init, so without a limit the desktop never starts.
# The wait is capped at 15 s and a timeout is not an error (a "-" before the command ignores its exit status), so offline boots
# finish with no failed unit.
[Service]
ExecStart=
ExecStart=-/usr/bin/timeout 15 /usr/lib/systemd/systemd-time-wait-sync
TimeoutStartSec=30s
