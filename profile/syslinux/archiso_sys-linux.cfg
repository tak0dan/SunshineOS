LABEL arch
TEXT HELP
Start the Sunshine OS live session (BIOS).
Try it without changing anything, or install it from the desktop.
ENDTEXT
MENU LABEL Sunshine OS: live session and installer
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Start Sunshine OS with a screen reader (BIOS).
Spoken feedback for the live session and installer.
ENDTEXT
MENU LABEL Sunshine OS with ^screen reader
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
