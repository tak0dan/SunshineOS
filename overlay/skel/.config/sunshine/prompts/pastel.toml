# Sunshine OS prompt: Pastel Powerline preset (starship presets) in Sunshine colours, sun as OS icon
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#ffe8c2)\
$os\
$username\
[](bg:#ffc43d fg:#ffe8c2)\
$directory\
[](fg:#ffc43d bg:#ffb86b)\
$git_branch\
$git_status\
[](fg:#ffb86b bg:#ff9654)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#ff9654 bg:#e8741f)\
$docker_context\
[](fg:#e8741f bg:#7a3b12)\
$time\
[ ](fg:#7a3b12)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = false
style_user = "bg:#ffe8c2 fg:#2a1a0e"
style_root = "bg:#ffe8c2 fg:#2a1a0e"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#ffe8c2 fg:#2a1a0e"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Unknown = "󰖙"
Linux = "󰖙"
Arch = "󰖙"

[directory]
style = "bg:#ffc43d fg:#2a1a0e"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#e8741f fg:#2a1a0e"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#ffb86b fg:#2a1a0e"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#ffb86b fg:#2a1a0e"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[jj_bookmark]
symbol = ""
style = "bg:#ffb86b fg:#2a1a0e"
format = '[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ]($style)'

[jj_status]
style = "bg:#ffb86b fg:#2a1a0e"
format = '[$all ]($style)'

[julia]
symbol = " "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#ff9654 fg:#2a1a0e"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#7a3b12 fg:#ffe8c2"
format = '[ ♥ $time ]($style)'

[cmd_duration]
min_time = 500
show_milliseconds = false
format = '[ 󱦟 $duration ](fg:#ff9654)'

[status]
disabled = false
format = '[$symbol$status ]($style)'
symbol = '✘ '
success_symbol = ''
not_found_symbol = '? '
sigint_symbol = '󰜺 '
signal_symbol = '⚡'
style = 'fg:#ff8f7a bold'

[character]
success_symbol = '[❯](bold fg:#ffc43d)'
error_symbol = '[❯](bold fg:#ff8f7a)'
