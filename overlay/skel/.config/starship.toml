# Sunshine OS prompt: the Tokyo Night preset layout (starship presets) in Sunshine colours, with the sun as OS icon
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#ffe8c2)\
$os\
[](bg:#ff9654 fg:#ffe8c2)\
$directory\
[](fg:#ff9654 bg:#262f47)\
$git_branch\
$git_status\
[](fg:#262f47 bg:#1d2538)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#1d2538 bg:#161c2b)\
$cmd_duration\
$time\
[ ](fg:#161c2b)\
\n$status$character"""

[directory]
style = "fg:#2a1a0e bg:#ff9654"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#262f47"
format = '[[ $symbol $branch ](fg:#ff9654 bg:#262f47)]($style)'

[git_status]
style = "bg:#262f47"
format = '[[($all_status$ahead_behind )](fg:#ff9654 bg:#262f47)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:#262f47"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:#ff9654 bg:#262f47)]($style)'

[jj_status]
style = "bg:#262f47"
format = '[[($all )](fg:#ff9654 bg:#262f47)]($style)'

[nodejs]
symbol = ""
style = "bg:#1d2538"
format = '[[ $symbol ($version) ](fg:#ff9654 bg:#1d2538)]($style)'

[bun]
symbol = ""
style = "bg:#1d2538"
format = '[[ $symbol ($version) ](fg:#ff9654 bg:#1d2538)]($style)'

[rust]
symbol = ""
style = "bg:#1d2538"
format = '[[ $symbol ($version) ](fg:#ff9654 bg:#1d2538)]($style)'

[golang]
symbol = ""
style = "bg:#1d2538"
format = '[[ $symbol ($version) ](fg:#ff9654 bg:#1d2538)]($style)'

[php]
symbol = ""
style = "bg:#1d2538"
format = '[[ $symbol ($version) ](fg:#ff9654 bg:#1d2538)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#161c2b"
format = '[[  $time ](fg:#ffcba0 bg:#161c2b)]($style)'

[os]
style = "bg:#ffe8c2 fg:#2a1a0e"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Unknown = "󰖙"
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰖙"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[cmd_duration]
min_time = 500
show_milliseconds = false
style = "bg:#161c2b"
format = '[[ 󱦟 $duration ](fg:#ff9654 bg:#161c2b)]($style)'

[status]
disabled = false
format = '[$symbol$status ]($style)'
symbol = '✘ '
success_symbol = ''
not_found_symbol = '? '
sigint_symbol = '󰜺 '
signal_symbol = '⚡'
style = 'fg:#ff8f7a bold'
map_symbol = true
recognize_signal_code = true

[character]
success_symbol = '[❯](bold fg:#ffc43d)'
error_symbol = '[❯](bold fg:#ff8f7a)'
