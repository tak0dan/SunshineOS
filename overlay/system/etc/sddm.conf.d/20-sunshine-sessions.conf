# Only the Sunshine sessions are offered: Plasma and Sunshine (Hyprland). The stock "Hyprland" entries of the hyprland
# package start the compositor without the safety net (VM-safe settings, fallback to Plasma) and crash on machines without 3D.
[Wayland]
SessionDir=/usr/share/sunshine/wayland-sessions

[X11]
SessionDir=/usr/share/sunshine/xsessions
