# Sunshine tools settings. Per-user overrides: ~/.config/sunshine/tools.conf
# cozy:      on = warm messages with sun and tea emojis, off = plain messages
# animation: on = animated progress graphs while an action runs, the Sunshine OS logo animation when it succeeded
# graph:     auto = cycle through four graphs (bars, wave, equalizer, pulse), or bars|wave|eq|pulse
# night:     auto = night messages from 22:00 to 08:00 local time (rose-pine blue/pink logo), on, off
# language:  auto (Ukrainian when the system language is Ukrainian or the install location file says Toulouse), en, uk
cozy=on
animation=on
graph=auto
night=auto
language=auto
# visuals_on_update: on = every Sunshine update also pulls the latest themes from the assets repository (your own visual changes are backed up first)
visuals_on_update=off
